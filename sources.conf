# NippApp sources: the carriers NippApp can "receive", and the capture that stands in for each.
#
#   freq(MHz)  pol  symrate(ksym/s)  kind  file  [loop|stop]
#
# freq, pol and symrate are what a search tunes to; a tune matches within 4 MHz and 2%.
# kind is ts (MPE in a transport stream) or pcap (IP packets taken from a GSE carrier).
# Relative file names are relative to this file. At the end of the file the source loops or
# stops (the default), leaving the tuner locked with no data.

11471  V  27500  ts  ../Streams/DvbNIP/1097000.ts            stop
#11013 H  27500  ts  ../Streams/DvbNIP/1087000.ts            stop
#11355 H  27500  ts  ../Streams/DvbNIP/1067000.ts            stop
#11013 H  27500  ts  ../Streams/DvbNIP/20240902Hbtxp6_4mn.ts loop   # same carrier as 1087000: use one or the other
10900  H  30000  pcap ../Streams/DvbNIP/2025-02-11_1min.pcap stop
#11200 V  27500  pcap ../Streams/DvbNIP/TP37_2min_231106.pcap   stop
